<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze with Keys and Doors</title>
<style>
body{font:15px system-ui,sans-serif;margin:24px;background:#f6f7fb;color:#172033}h1{margin:0 0 14px}.controls,.inventory{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,label.file{border:0;border-radius:7px;padding:9px 13px;background:#293b70;color:white;cursor:pointer}input,select{padding:8px;border:1px solid #bac2d3;border-radius:6px}#grid{display:grid;gap:3px;width:min(78vw,680px);margin-top:16px}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;font-weight:700;font-size:clamp(10px,2vw,16px);position:relative}.path{outline:3px solid #ffd43b;z-index:1}.here{box-shadow:0 0 0 4px #1d4ed8;z-index:2}.unlocked:after{content:'✓';position:absolute;right:1px;top:-2px;font-size:11px;color:#137547}.keytaken{opacity:.38}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.swatch{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:4px;border:1px solid #777}.status{font-weight:600}.inventory span{padding:5px 8px;border-radius:5px;background:white;border:1px solid #ccd2df}
</style>
<h1>Maze with Keys and Doors</h1>
<div class="controls"><label>Grid CSV <input id="file" type="file" accept=".csv,text/csv"></label><label>Size <input id="size" type="number" min="4" max="40" value="12" style="width:65px"></label><label>Pairs <input id="types" type="number" min="1" max="6" value="3" style="width:55px"></label><button id="generate">Generate maze</button><button id="solve">Find shortest path</button><button id="play">▶ Animate</button><button id="export">Export path CSV</button></div>
<div class="status" id="status">Load a CSV grid or generate a maze.</div><div class="inventory" id="inventory">Keys:</div><div id="grid"></div><div class="legend" id="legend"></div>
<script>
let maze=[], path=[], tick=0, timer=null, unlocked=new Set(), taken=new Set(), exitOverride=null;
const colors={a:'#ffd166',b:'#06d6a0',c:'#a78bfa',d:'#f4a261',e:'#4cc9f0',f:'#f72585'};
const $=id=>document.getElementById(id);
// E is both the specified exit symbol and the door for key e. When both
// exist, use the last E in row-major order as the exit and earlier Es as doors.
function exitCell(){if(exitOverride&&maze[exitOverride[0]]?.[exitOverride[1]]==='E')return exitOverride;let found=[];maze.forEach((row,r)=>row.forEach((v,c)=>{if(v==='E')found.push([r,c])}));return found.length?found.at(-1):null}
function isExit(r,c){let p=exitCell();return !!p&&p[0]===r&&p[1]===c}
function isDoor(r,c){let v=maze[r][c];return /^[A-F]$/.test(v)&&!isExit(r,c)}
function draw(){let el=$('grid');el.style.gridTemplateColumns=`repeat(${maze.length},1fr)`;el.innerHTML='';let pos=path[tick];
 maze.forEach((row,r)=>row.forEach((v,c)=>{let d=document.createElement('div');d.className='cell';d.textContent=v;d.dataset.rc=r+','+c;
 if(v==='#')d.style.background='#151515';else if(v==='S')d.style.background='#50b86b';else if(isExit(r,c))d.style.background='#e85d5d';else if(/^[a-f]$/.test(v)){d.style.background=colors[v];if(taken.has(v))d.classList.add('keytaken')}else if(isDoor(r,c)){d.style.background=colors[v.toLowerCase()];if(unlocked.has(r+','+c)){d.style.background='white';d.textContent='✓';d.classList.add('unlocked')}}else d.style.background='white';
 if(path.some(p=>p[0]===r&&p[1]===c))d.classList.add('path');if(pos&&pos[0]===r&&pos[1]===c)d.classList.add('here');el.appendChild(d)}));
 $('inventory').innerHTML='Keys: '+[...'abcdef'].map(k=>`<span style="border-color:${colors[k]};opacity:${taken.has(k)?1:.35}">${k.toUpperCase()} ${taken.has(k)?'✓':'○'}</span>`).join('');
 $('legend').innerHTML=['.','#','S','E',...'abcdef',...'ABCDEF'].map(v=>{let col=v==='#'?'#151515':v==='S'?'#50b86b':v==='E'?'#e85d5d':colors[v.toLowerCase()]||'white';return `<span><i class="swatch" style="background:${col}"></i>${v}</span>`}).join('')}
function parse(text){let rows=text.trim().split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>s.includes(',')?s.split(',').map(x=>x.trim()):[...s.replace(/\s/g,'')]);if(rows.length===1&&rows[0].length===1&&/^\d+$/.test(rows[0][0]))throw Error('CSV contains only a size; grid rows are missing.');if(!rows.length||rows.some(r=>r.length!==rows.length))throw Error('Grid must be square.');maze=rows;exitOverride=null;path=[];tick=0;unlocked.clear();taken.clear();draw();$('status').textContent=`Loaded ${maze.length} × ${maze.length} grid.`}
function generate(){let n=+$('size').value,t=+$('types').value;if(n<4||n>40||t<1||t>6||n*n<2*t+2)throw Error('Use size 4..40, 1..6 pairs, and enough cells.');
 // Random self-avoiding route, then place each key immediately before its door.
 let route=[];for(let attempt=0;attempt<500;attempt++){route=[[Math.random()*n|0,Math.random()*n|0]];let used=new Set([route[0].join(',')]);while(route.length<n*n){let [r,c]=route.at(-1),opts=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([y,x])=>y>=0&&y<n&&x>=0&&x<n&&!used.has(y+','+x));if(!opts.length)break;let p=opts[Math.random()*opts.length|0];route.push(p);used.add(p.join(','))}if(route.length>=2*t+2)break}
 if(route.length<2*t+2)throw Error('Could not make a route. Increase size.');maze=Array.from({length:n},()=>Array.from({length:n},()=>Math.random()<.32?'#':'.'));let len=Math.max(2*t+2,Math.min(route.length,Math.floor(n*n/2))),rte=route.slice(0,len);rte.forEach(([r,c])=>maze[r][c]='.');let [r,c]=rte[0];maze[r][c]='S';[r,c]=rte.at(-1);maze[r][c]='E';exitOverride=[r,c];for(let i=0;i<t;i++){[r,c]=rte[1+2*i];maze[r][c]=String.fromCharCode(97+i);[r,c]=rte[2+2*i];maze[r][c]=String.fromCharCode(65+i)}path=[];tick=0;unlocked.clear();taken.clear();draw();$('status').textContent=`Generated ${n} × ${n} maze with ${t} key/door pairs.`}
function solve(){if(!maze.length)throw Error('Load or generate a maze first.');let n=maze.length,S=null,keys=new Set(),doors=new Set();maze.forEach((row,r)=>row.forEach((v,c)=>{if(v==='S')S=[r,c];if(/^[a-f]$/.test(v))keys.add(v);if(isDoor(r,c))doors.add(v.toLowerCase())}));if(!S||maze.flat().filter(x=>x==='S').length!==1||!exitCell()||keys.size!==doors.size||[...keys].some(k=>!doors.has(k)))throw Error('Need exactly one S and E, with matching key/door types.');let q=[[...S,0]],head=0,par=new Map(),key=(r,c,m)=>r+','+c+','+m;par.set(key(...q[0]),null);let end=null;while(head<q.length){let [r,c,m]=q[head++],k=key(r,c,m);if(isExit(r,c)){end=k;break}for(let [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){let y=r+dr,x=c+dc;if(y<0||y>=n||x<0||x>=n||maze[y][x]==='#')continue;let v=maze[y][x];if(isDoor(y,x)&&!(m&(1<<(v.toLowerCase().charCodeAt(0)-97))))continue;let mm=m;if(/^[a-f]$/.test(v))mm|=1<<(v.charCodeAt(0)-97);let kk=key(y,x,mm);if(!par.has(kk)){par.set(kk,k);q.push([y,x,mm])}}}if(!end){path=[];$('status').textContent='No path: -1';draw();return}path=[];for(let k=end;k!==null;k=par.get(k)){let [r,c]=k.split(',').map(Number);path.push([r,c])}path.reverse();tick=0;unlocked.clear();taken.clear();$('status').textContent=`Shortest path: ${path.length-1} steps.`;draw()}
function animate(){if(!path.length)solve();if(!path.length)return;clearInterval(timer);tick=0;unlocked.clear();taken.clear();timer=setInterval(()=>{let [r,c]=path[tick],v=maze[r][c];if(/^[a-f]$/.test(v))taken.add(v);if(isDoor(r,c))unlocked.add(r+','+c);draw();if(tick++>=path.length-1){clearInterval(timer);$('status').textContent+=` Animation complete (${path.length-1} steps).`}},350)}
$('file').onchange=async e=>{try{parse(await e.target.files[0].text())}catch(x){$('status').textContent=x.message}};$('generate').onclick=()=>{try{generate()}catch(e){$('status').textContent=e.message}};$('solve').onclick=()=>{try{solve()}catch(e){$('status').textContent=e.message}};$('play').onclick=()=>{try{animate()}catch(e){$('status').textContent=e.message}};$('export').onclick=()=>{if(!path.length)solve();if(!path.length)return;let on=new Set(path.map(([r,c])=>r+','+c));let out=maze.map((row,r)=>row.map((v,c)=>on.has(r+','+c)?(v==='.'?'x':`x(${v})`):v).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='maze_path.csv';a.click();URL.revokeObjectURL(a.href)};
</script></html>
